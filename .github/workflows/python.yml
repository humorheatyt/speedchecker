name: Python

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The project is NOT installed as a module: only requirements are.
      - run: python -m pip install -r requirements.txt pytest
      - run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=short 2>&1 | tee "${{ runner.temp }}/pytest.log"
        shell: bash
      - name: Upload pytest log
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python }}-${{ matrix.os }}
          path: ${{ runner.temp }}/pytest.log
        if: always()
      - name: Comment PR on failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const logPath = path.join(process.env.RUNNER_TEMP, 'pytest.log');
            const log = fs.readFileSync(logPath, 'utf8');
            const body = '### Pytest failure ${{ matrix.python }} ${{ matrix.os }}\n```\n' + log.slice(0, 50000) + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
      - run: python app.py --cli --help
      - run: python app.py --cli --demo -s -r 2 locations.json -o ${{ runner.temp }}/report.json

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff build
      - run: ruff check .
      - run: python -m build
