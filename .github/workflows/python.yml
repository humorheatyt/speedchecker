name: Python

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The project is NOT installed as a module: only requirements are.
      - run: python -m pip install -r requirements.txt pytest
      - run: |
          python -m pytest tests/ -v --tb=short 2>&1 | tee /tmp/pytest.log
          echo "PYTEST_EXIT=$?" >> $GITHUB_ENV
      - name: Upload pytest log
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python }}-${{ matrix.os }}
          path: /tmp/pytest.log
        if: always()
      - name: Add log to summary
        if: always()
        run: |
          echo '### Pytest log' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/pytest.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Show pytest log on failure
        if: env.PYTEST_EXIT != '0'
        run: cat /tmp/pytest.log
      - run: python app.py --cli --help
        if: env.PYTEST_EXIT == '0'
      - run: python app.py --cli --demo -s -r 2 locations.json -o ${{ runner.temp }}/report.json
        if: env.PYTEST_EXIT == '0'

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff build
      - run: ruff check .
      - run: python -m build
