[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vpnchecker"
version = "1.0.0"
description = "Python ExpressVPN speed benchmarking CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "vpnchecker contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.9"]

[project.scripts]
vpnchecker = "vpnchecker.cli:main"
expressvpnspeedtest = "vpnchecker.cli:main"

[project.urls]
Repository = "https://github.com/humorheatyt/vpnchecker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
