[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "speedchecker"
version = "2.0.0"
description = "SpeedChecker — internet & ExpressVPN speed testing with a PyQt6 GUI and a built-in speed engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "speedchecker contributors"}]
dependencies = ["PyQt6>=6.6"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: X11 Applications :: Qt",
]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.9", "pytest>=8"]

[project.scripts]
speedchecker = "speedchecker.cli:main"
speedchecker-gui = "speedchecker.gui:main"
expressvpnspeedtest = "speedchecker.cli:main"

[project.urls]
Repository = "https://github.com/humorheatyt/speedchecker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
